name: Contributors

# The wall lives in readme-contributors as a reusable workflow. This file used
# to be a copy of it, carrying a `git add` that named a file this repository
# does not have, so the step died at exit 128 before it could commit, and the
# wall stayed empty.
#
# The wall is written straight to main after every merge, with no separate
# pull request. main is protected, so it pushes through the write deploy key
# stored as CONTRIBUTORS_DEPLOY_KEY; `secrets: inherit` hands it over.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wall:
    uses: YauhenBichel/readme-contributors/.github/workflows/wall.yml@2d1790d6a11795866916337238d212de87e06fad # v1.8.0
    secrets: inherit
